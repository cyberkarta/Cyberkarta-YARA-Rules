name: Validate rules

on:
  pull_request:
    paths:
      - "rules/**"
      - "tools/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "tools/**"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yara-python
      - run: python tools/compile_check.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install plyara
      - run: python tools/lint_meta.py
